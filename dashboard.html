<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>SmartLead AI - Yönetim Paneli</title>
    <style>
        body { font-family: sans-serif; background-color: #1e1e24; color: #fff; padding: 20px; }
        h1 { color: #00d2ff; }
        .kpi-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .kpi-card { background: #2b2b36; padding: 20px; border-radius: 8px; flex: 1; border-left: 4px solid #00d2ff; }
        table { width: 100%; border-collapse: collapse; background: #2b2b36; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #3f3f4e; }
        th { background-color: #3f3f4e; color: #00d2ff; }
    </style>
</head>
<body>
    <h1>Yönetim Paneli</h1>
    <div class="kpi-container">
        <div class="kpi-card">
            <h3>Toplam Müşteri Adayı</h3>
            <h2>{{ toplam_aday }}</h2>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>İsim</th>
                <th>İletişim</th>
                <th>Mesaj</th>
                <th>Tarih</th>
            </tr>
        </thead>
        <tbody>
            {% for aday in adaylar %}
            <tr>
                <td><strong>{{ aday.isim }}</strong></td>
                <td>{{ aday.iletisim }}</td>
                <td>{{ aday.mesaj }}</td>
                <td>{{ aday.tarih }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" style="text-align: center;">Henüz kayıtlı lead bulunmuyor.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
